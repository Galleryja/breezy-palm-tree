<text x="7.00" y="11.60" font-family='Palatino, Georgia, serif' font-size="2.10" fill="#48515c">Pure and natural.</text>
<text x="7.00" y="14.20" font-family='Palatino, Georgia, serif' font-size="2.10" fill="#48515c">Elevated skincare.</text>
<text x="7.00" y="19.00" font-family='Palatino, Georgia, serif' font-size="1.90" fill="#15181c" letter-spacing="0.500">INGREDIENTS</text>
<text x="7.00" y="21.90" font-family='Palatino, Georgia, serif' font-size="1.80" fill="#48515c">Grass-fed beef tallow, organic shea butter, organic</text>
<text x="7.00" y="24.25" font-family='Palatino, Georgia, serif' font-size="1.80" fill="#48515c">jojoba oil, organic cedarwood oil, organic vetiver</text>
<text x="7.00" y="26.60" font-family='Palatino, Georgia, serif' font-size="1.80" fill="#48515c">oil.</text>
<text x="136.00" y="7.40" font-family='Palatino, Georgia, serif' font-size="1.90" fill="#15181c" letter-spacing="0.500">DIRECTIONS</text>
<text x="136.00" y="10.30" font-family='Palatino, Georgia, serif' font-size="1.75" fill="#48515c">Start with small amount, massage onto clean,</text>
<text x="136.00" y="12.60" font-family='Palatino, Georgia, serif' font-size="1.75" fill="#48515c">slightly damp skin. Allow a few minutes for</text>
<text x="136.00" y="14.90" font-family='Palatino, Georgia, serif' font-size="1.75" fill="#48515c">absorption.</text>
<text x="136.00" y="18.70" font-family='Palatino, Georgia, serif' font-size="1.90" fill="#15181c" letter-spacing="0.500">BENEFITS</text>
<text x="136.00" y="21.60" font-family='Palatino, Georgia, serif' font-size="1.75" fill="#48515c">Clean tallow moisturizer, rich in vitamins A, D, E</text>
<text x="136.00" y="23.90" font-family='Palatino, Georgia, serif' font-size="1.75" fill="#48515c">and K, enhanced with natural ingredients to</text>
<text x="136.00" y="26.20" font-family='Palatino, Georgia, serif' font-size="1.75" fill="#48515c">replenish skin, leaving it soft.</text>
<text x="136.00" y="30.00" font-family='Palatino, Georgia, serif' font-size="1.70" fill="#636c77" font-style="italic">Store in a cool, dry place.</text>
</svg>
